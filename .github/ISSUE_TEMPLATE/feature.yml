name: Feature
description: Define a product capability or business outcome that will be decomposed into user stories.
title: "[Feature]: "
labels:
  - "feature"
body:

  - type: markdown
    attributes:
      value: |
        ## Feature

        Use this template to define a meaningful product capability or business outcome.

        Features should describe **what capability is needed and why it matters**,
        not prescribe the detailed technical implementation.

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: Provide a concise description of the capability being requested.
      placeholder: |
        Describe the feature in 2–4 sentences.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Opportunity
      description: Describe the problem being solved or opportunity being addressed.
      placeholder: |
        What problem exists today?

        Who is affected?

        Why does it matter?
    validations:
      required: true

  - type: textarea
    id: current-state
    attributes:
      label: Current State
      description: Describe how the capability or process works today.
      placeholder: |
        Today...
    validations:
      required: true

  - type: textarea
    id: desired-state
    attributes:
      label: Desired State
      description: Describe the expected state after the feature is delivered.
      placeholder: |
        After this feature is delivered...
    validations:
      required: true

  - type: textarea
    id: business-value
    attributes:
      label: Business Value
      description: Explain the measurable value this feature provides.
      placeholder: |
        Examples:
        - Reduces operational effort
        - Improves customer experience
        - Reduces security or business risk
        - Enables a new capability
        - Improves reliability
        - Supports a regulatory requirement
    validations:
      required: true

  - type: textarea
    id: feature-statement
    attributes:
      label: Feature Statement
      description: Describe the feature from the perspective of the primary beneficiary.
      value: |
        **As a** [user / persona / stakeholder]

        **I want** [capability]

        **So that** [business value / outcome]
    validations:
      required: true

  - type: textarea
    id: stakeholders
    attributes:
      label: Users / Stakeholders
      description: Identify the primary users, stakeholders, or teams impacted by this feature.
      placeholder: |
        Primary Users:
        - ...

        Stakeholders:
        - ...
    validations:
      required: true

  - type: textarea
    id: in-scope
    attributes:
      label: In Scope
      description: Clearly identify the capabilities included in this feature.
      placeholder: |
        - Capability 1
        - Capability 2
        - Capability 3
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
      description: Identify capabilities explicitly excluded from this feature.
      placeholder: |
        - Capability not included
        - Future enhancement
        - Related work handled elsewhere
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Feature Acceptance Criteria
      description: Define high-level conditions that demonstrate the feature delivers the expected capability.
      placeholder: |
        - [ ] The capability allows...
        - [ ] Users are able to...
        - [ ] The solution provides...
        - [ ] The expected business outcome is achieved...
    validations:
      required: true

  - type: textarea
    id: success-measures
    attributes:
      label: Success Measures
      description: Define how the Product Owner will determine whether the feature delivered its intended value.
      placeholder: |
        Metric:
        Baseline:
        Target:
        Measurement Method:
    validations:
      required: true

  - type: textarea
    id: non-functional
    attributes:
      label: Non-Functional Requirements
      description: Document applicable quality, security, operational, or compliance requirements.
      placeholder: |
        Security:
        - ...

        Performance:
        - ...

        Availability / Reliability:
        - ...

        Scalability:
        - ...

        Accessibility:
        - ...

        Compliance:
        - ...

        Observability / Monitoring:
        - ...
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Identify systems, teams, services, features, or decisions required for delivery.
      placeholder: |
        - Dependency
        - External team
        - Related feature
    validations:
      required: false

  - type: textarea
    id: risks
    attributes:
      label: Risks / Constraints
      description: Identify known risks, limitations, assumptions, or constraints.
      placeholder: |
        Risk:
        Impact:
        Mitigation:
    validations:
      required: false

  - type: textarea
    id: stories
    attributes:
      label: User Stories
      description: Link the user stories that decompose this feature.
      placeholder: |
        - [ ] #123
        - [ ] #124
        - [ ] #125
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add architecture, design, research, documentation, diagrams, or related references.
      placeholder: |
        Related Issues:
        Design / Architecture:
        Documentation:
        Research:
    validations:
      required: false
